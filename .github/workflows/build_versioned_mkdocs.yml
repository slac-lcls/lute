name: Build Documentation
on:
  push:
    branches:
      - dev
    tags:
      - '*'
    #paths:
    #  - 'docs/**'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  mkdocs_build:
    runs-on: ubuntu-latest
    steps:
      - name: Get branch name
        id: branch-names
        uses: tj-actions/branch-names@5250492686b253f06fa55861556d1027b067aeb5              # v9
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0                     # v7
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1                 # v6
        with:
          python-version: 3.10.14
      - name: Install dependencies
        run: pip install mkdocs mkdocs-material mkdocstrings "mkdocstrings[python]" mike
      - name: Git Config
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "<>"
      - name: Build dev version
        if: steps.branch-names.outputs.current_branch == 'dev'
        run: mike deploy --push dev
      - name: Build release
        #if: steps.branch-names.outputs.current_branch == 'main'
        if: steps.branch-names.outputs.is_tag == 'true'
        run: mike deploy --push --update-aliases ${{ steps.branch-names.outputs.tag }} latest
