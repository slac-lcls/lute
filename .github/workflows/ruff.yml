name: Ruff-lint
on: [push, pull_request]
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v1
        with:
          src: "./lute ./launch_scripts ./utilities ./run_task.py ./subprocess_task.py ./workflows"
          args: "check"
