##############################################################################
# SFX EXAMPLE 3 — MERGING: single run
#
# ManagedTask: CCTBXMerger  (Task class: MergeCCTBXXFEL)
# Binary:  cctbx.xfel.merge  (via mpirun, merging-only step list)
#
# Assumes scaling was already done by CCTBXScaler (Example 2).
# input_path is auto-resolved from the ScaleCCTBXXFEL result in the LUTE DB
# when left empty, or can be set explicitly as shown below.
##############################################################################
title: "MFX Lysozyme — merging single run r0037"
experiment: mfx101624926
run: 37
date: "2024/10/16"
lute_version: 0.3.0
task_timeout: 3600
work_dir: /sdf/data/lcls/ds/mfx/mfx101624926/scratch
---
MergeCCTBXXFEL:
  phil_parameters:
    # Dispatch: merging-only (no re-scaling)
    dispatch_step_list: >-
      input model_scaling statistics_unitcell statistics_beam
      model_statistics statistics_resolution group errors_merge
      statistics_intensity merge statistics_intensity_cxi

    # Input: auto-resolved from ScaleCCTBXXFEL result in DB when left empty.
    # Set explicitly to override:
    input_path: /sdf/data/lcls/ds/mfx/mfx101624926/results/pam/r0037/001_rg018/task009/out
    input_experiments_suffix: .expt
    input_reflections_suffix: .refl

    # Reference model for statistics
    scaling_model: /sdf/data/lcls/ds/mfx/mfx101624926/scratch/tutorial/pdb/8P1C.pdb
    scaling_algorithm: mark0

    # Merging
    merging_d_min: 1.8
    merging_merge_anomalous: True
    merging_minimum_multiplicity: 2
    merging_error_model: ev11
    merging_error_ev11_minimizer: lbfgs

    # Output
    output_prefix: Lysozyme_smallerUC_v000
    output_output_dir: /sdf/data/lcls/ds/mfx/mfx101624926/results/pam/Lysozyme_smallerUC/v000

    # Statistics
    statistics_n_bins: 20
