##############################################################################
# SFX EXAMPLE 2 — SCALING ONLY
#
# ManagedTask: CCTBXScaler  (Task class: ScaleCCTBXXFEL)
# Binary:  cctbx.xfel.merge  (via mpirun, scaling-only step list)
#
# Reads *_integrated.expt/.refl from the indexing output directory.
# Produces scaled .expt/.refl in output_output_dir.
# The output path is stored in the LUTE DB so the downstream
# CCTBXMerger step can auto-resolve input_path.
##############################################################################
title: "MFX Lysozyme — scaling r0036"
experiment: mfx101624926
run: 36
date: "2024/10/16"
lute_version: 0.3.0
task_timeout: 3600
work_dir: /sdf/data/lcls/ds/mfx/mfx101624926/scratch
---
ScaleCCTBXXFEL:
  phil_parameters:
    # Dispatch: scaling-only pipeline (this is the default; shown for clarity)
    dispatch_step_list: >-
      input balance model_scaling modify filter scale postrefine
      statistics_unitcell statistics_beam model_statistics statistics_resolution

    # Input: indexed data from CCTBXIndexer
    input_path: /sdf/data/lcls/ds/mfx/mfx101624926/results/pam/r0036/cctbx_indexed

    # Filtering: value-based unit cell filter
    filter_algorithm: "n_obs resolution unit_cell"
    filter_unit_cell_algorithm: value
    filter_unit_cell_value_target_unit_cell: "78 78 39 90 90 90"
    filter_unit_cell_value_relative_length_tolerance: 0.03
    filter_unit_cell_value_absolute_angle_tolerance: 2.0
    filter_unit_cell_value_target_space_group: "P 43 21 2"
    filter_outlier_min_corr: -1.0   # no correlation filter on first pass

    # Reflection selection
    select_algorithm: significance_filter
    select_significance_filter_sigma: 0.1

    # Scaling: mark0 with PDB reference
    scaling_model: /sdf/data/lcls/ds/mfx/mfx101624926/scratch/tutorial/pdb/8P1C.pdb
    scaling_algorithm: mark0      # mark0 = per-image scaling; mark1 = no scaling
    scaling_resolution_scalar: 0.993420862158964

    # Resolution cutoff (required even in scaling-only mode)
    merging_d_min: 1.8
    merging_merge_anomalous: True

    # Output
    output_prefix: scaling_r0036
    output_output_dir: /sdf/data/lcls/ds/mfx/mfx101624926/results/pam/r0036/000_rg009/task009/out
    output_save_experiments_and_reflections: True   # REQUIRED for downstream merging
    output_do_timing: True

    # Statistics
    statistics_n_bins: 20
