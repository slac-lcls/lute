##############################################################################
# SFX EXAMPLE 1 — INDEXING
#
# ManagedTask: CCTBXIndexer  (Task class: IndexCCTBXXFEL)
# Binary:  dials.stills_process  (via mpirun)
#
# This runs spotfinding + indexing + integration on LCLS XTC data.
# Outputs *_integrated.expt / *_integrated.refl to output_output_dir.
##############################################################################
title: "MFX Lysozyme — indexing r0036"
experiment: mfx101624926
run: 36
date: "2024/10/16"
lute_version: 0.3.0
task_timeout: 7200
work_dir: /sdf/data/lcls/ds/mfx/mfx101624926/scratch
---
IndexCCTBXXFEL:
  # Data source: psana .loc file written automatically from data_spec
  data_spec:
    exp: mfx101624926
    run: 36
    dir: /sdf/data/lcls/ds/mfx/mfx101624926/xtc
    detname: epix10ka2m

  phil_parameters:
    # Input
    input_reference_geometry: /sdf/data/lcls/ds/mfx/mfx101624926/results/common/geom/refined.expt

    # Output
    output_output_dir: /sdf/data/lcls/ds/mfx/mfx101624926/results/pam/r0036/cctbx_indexed
    output_composite_output: True         # one file per MPI rank — keep True for MPI jobs
    output_logging_dir: /sdf/data/lcls/ds/mfx/mfx101624926/results/pam/r0036/cctbx_indexed/logs
    output_logging_option: suppressed     # normal | suppressed | disabled

    # Dispatch
    dispatch_index: True
    dispatch_refine: False
    dispatch_integrate: True

    # MPI
    mp_method: mpi

    # Spotfinding
    spotfinder_lookup_mask: ~             # path/to/mask.pickle, or ~ for none
    spotfinder_threshold_dispersion_gain: ~   # leave None if detector model handles gain
    spotfinder_threshold_dispersion_sigma_bkgnd: 6.0
    spotfinder_threshold_dispersion_sigma_strong: 3.0
    spotfinder_threshold_dispersion_global_threshold: 0.0
    spotfinder_threshold_dispersion_kernel_size: [6, 6]
    spotfinder_filter_min_spot_size: 3
    spotfinder_filter_d_min: 1.8

    # Indexing
    indexing_known_symmetry_space_group: "P 43 21 2"
    indexing_known_symmetry_unit_cell: "78 78 39 90 90 90"
    indexing_stills_refine_candidates_with_known_symmetry: True
    indexing_stills_refine_all_candidates: True

    # Integration
    integration_background_simple_outlier_plane_n_sigma: 10
    integration_summation_detector_gain: 1.0

    # Profile
    profile_gaussian_rs_centroid_definition: com   # com | s1

    # Refinement
    refinement_reflections_outlier_algorithm: auto
