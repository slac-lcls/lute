%YAML 1.3
---
title: "LUTE Task Configuration"
experiment: "mfx100852324"
run: 298
date: "2026/07/01"
lute_version: 0.2.0
task_timeout: 30000
work_dir: "/tmp"
...
---
###########
# Smalldata
###########
SubmitSMD:
  # Command line arguments
  producer: "{{ work_dir }}/smalldata_tools/lcls2_producers/smd_producer.py"
  #run: 99
  #experiment: ""
  #stn: 0
  directory: "{{ work_dir }}"
  #config: "mfx_cctbx"
  gather_interval: 5
  nevents: 5000
  #norecorder: False
  #url: "https://pswww.slac.stanford.edu"
  #epicsAll: False
  #full: False
  #fullSum: False
  #default: true
  #image: False
  #tiff: False
  #centerpix: False
  #postRuntable: False
  #wait: False
  #xtcav: False
  #noarch: False
  lute_template_cfg:
    template_name: "smd2_prod_config_template.py" # Or the smd2 version
    output_path: "{{ work_dir }}/smalldata_tools/lcls2_producers/prod_config_mfx.py"
  # **************************************************************************/
  # * Below this point you will be configuring the prod_config_mfx file ******/
  # * This will overwrite any manual changes you make to that file      ******/
  # * Comment all the rest of these parameters out to manually edit     ******/
  # **************************************************************************/
  # Producer variables. These are substituted into the producer to run specific
  # data reduction algorithms. Uncomment and modify as needed.
  # If you prefer to modify the producer file directly, leave commented.
  # Beginning with `getROIs`, you will need to modify the first entry to be a
  # detector. This detector MUST MATCH one of the detectors in `detnames`.
  # In the future this will be automated. If you have multiple detectors you can
  # add them with their own set of parameters.
  detnames: ["jungfrau"]
  detSumAlgos:
    jungfrau:
      - calib
      - calib_max

###########
# BayFAI
###########
# powder left empty: auto-resolved from SubmitSMD DB result via validate_smd_path
# in_file left empty: auto-resolved from calibration DB via validate_metrology_path
# out_file left empty: auto-resolved via validate_geometry_path
BayFAI:
  detname: "jungfrau"
  calibrant: "AgBh"
  fixed: ["rot1", "rot2", "rot3"]
  center:
    dist: 0.13
    poni1: -0.001
    poni2: -0.006
    rot1: 0.0
    rot2: 0.0
    rot3: 0.0
  bo_params:
    n_samples: 5       # Reduced for functional test speed (default: 20)
    n_iterations: 10   # Reduced for functional test speed (default: 80)
    max_rings: 4
    seed: 42
...
