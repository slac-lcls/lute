%YAML 1.3
---
title: "LUTE Task Configuration" # Include experiment description if desired
experiment: "xpptut15"
run: 670
date: "2023/10/25"
lute_version: 0.3.0      # Do not be change unless need to force older version
task_timeout: 600
work_dir: "/tmp"

# Setup RUN_GROUPS once globally - Give you semantic range of runs
# In the Tasks, you define parameter policies
# Setting run to 9999 includes all runs. This is the largest LCLS run supported.
RUN_GROUPS:
  ALL_RUNS:
    applies_to:
      # Bounds are inclusive
      range: [0, 9999]
      # Alternatively, your group can use an explicit list
      # runs: [1, 2, 3, 4]

    # `default` applies to all the parameters
    default: @literal
...
---
Test:
  float_var: 0.01
  str_var: "test"
  compound_var:
    int_var: 10
    dict_var: {"a": "b"}
  throw_error: False # Set True to test Task failure

TestBinary:
  executable: "/sdf/home/d/dorlhiac/test_tasks/test_threads"
  p_arg1: 4 # Number of cores

TestBinaryErr:
  executable: "/sdf/home/d/dorlhiac/test_tasks/test_threads_err"
  p_arg1: 4 # Number of cores

TestSocket:
  array_size: 8000 # Size of arrays to send. 8000 floats ~ 6.4e4
  num_arrays: 10 # Number of arrays to send.
...
