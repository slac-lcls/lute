%YAML 1.3
---
title: "LUTE Task Configuration" # Include experiment description if desired
experiment: "mec101207525"
run: "76"
date: "2023/10/25"
lute_version: 0.3.0      # Do not be change unless need to force older version
task_timeout: 6000
work_dir: "/tmp"
...
---
###########
# Smalldata
###########

# Producer will be auto-determined. Set only if you have a separate install
# Set `directory` if you want to write to a different folder
# For out of memory issues try setting gather_interval
SubmitSMD:
  # Command line arguments
  #map_by: "core"   # MPI resource mapping - take care with changing unless familiar
  #bind_to: "core"  # MPI resource binding - take care with changing unless familiar
  # LCLS1 (psana1)
  producer: "{{ work_dir }}/smalldata_tools/lcls1_producers/smd_producer.py"
  lute_template_cfg:
    template_name: "smd1_prod_config_template.py"
    output_path: "{{ work_dir }}/smalldata_tools/lcls1_producers/prod_config_mec.py"
  #run: 99
  #experiment: ""
  #stn: 0
  #directory: ""
  #config: "mfx_cctbx"
  #gather_interval: 25
  #norecorder: False
  #url: "https://pswww.slac.stanford.edu"
  #epicsAll: False
  #full: False
  #fullSum: False
  #default: true
  #image: False
  #tiff: False
  #centerpix: False
  #postRuntable: False
  #wait: False
  #xtcav: False
  #noarch: False
  # Producer variables. These are substituted into the producer to run specific
  # data reduction algorithms. Uncomment and modify as needed.
  # If you prefer to modify the producer file directly, leave commented.
  # Beginning with `getROIs`, you will need to modify the first entry to be a
  # detector. This detector MUST MATCH one of the detectors in `detnames`.
  # In the future this will be automated. If you have multiple detectors you can
  # add them with their own set of parameters.
  producer_parameters:
    detnames: ["Epix10kaQuad0", "Epix10kaQuad1", "Epix10kaQuad2", "Epix10kaQuad3"]
    #epicsPV: []
    #epicsOncePV: []
    #ttCalib: []
    # Provide detector image sum algorithms.
    # If detSumAlgos is not defined, it will default to calib, calib_dropped and
    # calib_dropped_square for every detector. You can add processing algorithms for
    # single detectors (e.g. epix10k2M or Rayonix) as below, or add algorithms which
    # will apply to every detector defined in detnames by placing them under "all"
    detSumAlgos:
      all:
        - "calib"
        - "calib_max"

###########
# BayFAI
###########

# Depending on the Quad being calibrated, you may need to change the detname
# the fixed parameters, and the center standard configuration.
# For example, for Epix10kaQuad0, you would set (uncomment this)
BayFAI:
  fixed:
  - "rot1"
  - "rot3"
  center:
    dist: 0.27                # Fill this section with rough estimates
    poni1: 0.06
    poni2: 0.06
    rot1: 0.0
    rot2: -0.6
    rot3: 0.0
  bounds:
    dist: [-0.01, 0.01]
    poni1: [-0.01, 0.01]
    poni2: [-0.01, 0.01]
    rot1: [-0.1, 0.1]
    rot2: [-0.1, 0.1]
    rot3: [-0.1, 0.1]
  resolutions:
    dist: 0.001
    poni1: 0.0005
    poni2: 0.0005
    rot1: 0.01
    rot2: 0.01
    rot3: 0.01
  calibrant: "LaB6"           # Fill this line with calibrant name (CeO2, LaB6...)
  detname: "Epix10kaQuad0"
  wavelength: 1.3656642888421956e-10
  bayfai_params:
    Imin: 95
    pts_per_deg: 4.0

# For example, for Epix10kaQuad1, you would set
# BayFAI:
#   fixed:                
#   - "rot1"
#   - "rot3"
#   center:
#     dist: 0.28                # Fill this section with rough estimates
#     poni1: 0.09
#     poni2: -0.04
#     rot1: 0.0
#     rot2: -0.6
#     rot3: 0.0
#   calibrant: "CeO2"           # Fill this line with calibrant name (CeO2, LaB6...)
#   detname: "Epix10kaQuad1"

# For example, for Epix10kaQuad2, you would set
# BayFAI:
#   fixed:                
#   - "rot2"
#   - "rot3"
#   center:
#     dist: 0.19                # Fill this section with rough estimates
#     poni1: -0.01
#     poni2: 0.0
#     rot1: 1.1
#     rot2: 0.0
#     rot3: 0.0
#   calibrant: "CeO2"           # Fill this line with calibrant name (CeO2, LaB6...)
#   detname: "Epix10kaQuad2"

# For example, for Epix10kaQuad3, you would set
# BayFAI:
#   fixed:                
#   - "rot2"
#   - "rot3"
#   center:
#     dist: 0.1                 # Fill this section with rough estimates
#     poni1: -0.01
#     poni2: 0.04
#     rot1: -1.1
#     rot2: 0.0
#     rot3: 0.0
#   calibrant: "CeO2"           # Fill this line with calibrant name (CeO2, LaB6...)
#   detname: "Epix10kaQuad3"
...
