%YAML 1.3
---
title: "LUTE Task Configuration"
experiment: "xcs101632126"
run: 244
date: "2026/07/01"
lute_version: 0.3.0
task_timeout: 6000
work_dir: "/tmp"
...
---
###########
# Smalldata
###########
SubmitSMD:
  # Command line arguments
  producer: "{{ work_dir }}/smalldata_tools/lcls1_producers/smd_producer.py"
  #run: 99
  #experiment: ""
  #stn: 0
  directory: "{{ work_dir }}"
  #config: "mfx_cctbx"
  gather_interval: 5
  nevents: 5000
  #norecorder: False
  #url: "https://pswww.slac.stanford.edu"
  #epicsAll: False
  #full: False
  #fullSum: False
  #default: true
  #image: False
  #tiff: False
  #centerpix: False
  #postRuntable: False
  #wait: False
  #xtcav: False
  #noarch: False
  lute_template_cfg:
    template_name: "smd1_prod_config_template.py" # Or the smd2 version
    output_path: "{{ work_dir }}/smalldata_tools/lcls1_producers/prod_config_xcs.py"
  # **************************************************************************/
  # * Below this point you will be configuring the prod_config_mfx file ******/
  # * This will overwrite any manual changes you make to that file      ******/
  # * Comment all the rest of these parameters out to manually edit     ******/
  # **************************************************************************/
  # Producer variables. These are substituted into the producer to run specific
  # data reduction algorithms. Uncomment and modify as needed.
  # If you prefer to modify the producer file directly, leave commented.
  # Beginning with `getROIs`, you will need to modify the first entry to be a
  # detector. This detector MUST MATCH one of the detectors in `detnames`.
  # In the future this will be automated. If you have multiple detectors you can
  # add them with their own set of parameters.
  producer_parameters:
    detnames: ["epix10k2M"]
    getAzIntPyFAIParams:
      epix10k2M:
        #poni_file: "path/to/calib/r0244_image.poni"
        ai_kwargs:
          dist: 0.654
          poni1: 0.0849
          poni2: 0.0847
          rot1: 0.0
          rot2: 0.0
          rot3: 0.0
          wavelength: 1.2565e-10
        npts: 256
        npts_az: 36
        int_units: "q_A^-1"
        return2d: True
    getAzIntLCLSGeomParams:
      epix10k2M:
        #poni_file: "path/to/calib/r0244.poni"
        ai_kwargs:
          dist: 0.654
          poni1: 0.0002
          poni2: 0.0000
          rot1: 0.0
          rot2: 0.0
          rot3: 0.0
          wavelength: 1.2565e-10
        npts: 256
        npts_az: 36
        int_units: "q_A^-1"
        return2d: True
...
